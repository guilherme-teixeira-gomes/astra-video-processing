<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASTRA CONNECT — Processamento de Vídeos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0A0A0A;
    --paper: #FFFFFF;
    --line: #E5E5E5;
    --muted: #6B6B6B;
    --soft: #F7F7F7;
    --ok: #0A0A0A;
    --err: #B00020;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 24px; }

  /* Topbar */
  header {
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: rgba(255,255,255,.9);
    backdrop-filter: blur(8px); z-index: 10;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; height: 72px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { height: 40px; width: auto; }
  .brand-name { font-weight: 700; letter-spacing: .14em; font-size: 15px; }
  .brand-name small { font-weight: 300; letter-spacing: .3em; display: block; font-size: 9px; color: var(--muted); }
  .logout { background: none; border: none; color: var(--muted); font-family: inherit; font-size: 13px; cursor: pointer; }
  .logout:hover { color: var(--ink); }

  /* Auth */
  .auth-shell { min-height: calc(100vh - 72px); display: flex; align-items: center; justify-content: center; }
  .auth-card { width: 100%; max-width: 380px; }
  .auth-title { font-size: 22px; font-weight: 600; margin-bottom: 4px; text-align: center; }
  .auth-sub { color: var(--muted); font-size: 14px; text-align: center; margin-bottom: 32px; }

  label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; color: var(--ink); }
  input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    font-family: inherit; font-size: 15px; font-weight: 300; background: var(--paper); color: var(--ink);
    margin-bottom: 18px; transition: border-color .15s;
  }
  input:focus { outline: none; border-color: var(--ink); }

  .btn {
    width: 100%; padding: 13px; border: none; border-radius: 10px; background: var(--ink); color: var(--paper);
    font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-ghost { background: none; color: var(--muted); font-size: 13px; margin-top: 16px; }
  .btn-ghost:hover { color: var(--ink); }

  .switch { text-align: center; margin-top: 20px; font-size: 14px; color: var(--muted); }
  .switch button { background: none; border: none; color: var(--ink); font-weight: 500; cursor: pointer; font-family: inherit; font-size: 14px; text-decoration: underline; }

  .msg { padding: 11px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 18px; }
  .msg-err { background: #FDECEE; color: var(--err); }
  .msg-ok { background: var(--soft); color: var(--ink); }

  /* Dashboard */
  main { padding: 48px 0 80px; }
  .page-title { font-size: 26px; font-weight: 600; margin-bottom: 6px; }
  .page-sub { color: var(--muted); font-size: 15px; margin-bottom: 36px; }

  .upload-zone {
    border: 1.5px dashed var(--line); border-radius: 16px; padding: 40px 24px; text-align: center;
    transition: border-color .15s, background .15s; cursor: pointer; margin-bottom: 44px;
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--ink); background: var(--soft); }
  .upload-zone .node-ico { margin-bottom: 14px; }
  .upload-zone h3 { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
  .upload-zone p { color: var(--muted); font-size: 13px; }
  .upload-zone .fname { margin-top: 12px; font-size: 13px; font-weight: 500; color: var(--ink); }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .section-head h2 { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .refresh { font-size: 12px; color: var(--muted); }

  .list { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { background: var(--paper); padding: 18px 20px; display: flex; align-items: center; gap: 16px; }
  .row-node { flex-shrink: 0; }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .status { font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 5px 11px; border-radius: 20px; border: 1px solid var(--line); white-space: nowrap; }
  .status[data-s="CONCLUIDO"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .status[data-s="ERRO"] { background: #FDECEE; color: var(--err); border-color: #F5C6CD; }
  .status[data-s="PROCESSANDO"], .status[data-s="NA_FILA"] { background: var(--soft); color: var(--muted); }
  .dl { background: var(--ink); color: var(--paper); border: none; padding: 8px 16px; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
  .dl:hover { opacity: .85; }

  .empty { text-align: center; padding: 56px 24px; color: var(--muted); }
  .empty svg { opacity: .3; margin-bottom: 16px; }
  .empty p { font-size: 14px; }

  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: s .7s linear infinite; vertical-align: middle; }
  @keyframes s { to { transform: rotate(360deg); } }

  @media (max-width: 560px) {
    .row { flex-wrap: wrap; }
    .page-title { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* Marca: símbolo + wordmark em texto nítido */
  .auth-logo { text-align: center; margin-bottom: 36px; }
  .auth-symbol { height: 64px; width: auto; margin-bottom: 28px; display: block; margin-left: auto; margin-right: auto; }
  .wordmark {
    font-weight: 800; font-size: 26px; letter-spacing: .22em; line-height: 1;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .wordmark span { font-weight: 300; font-size: 11px; letter-spacing: .5em; color: var(--muted); padding-left: .5em; }
  .wordmark-sm { font-size: 16px; letter-spacing: .18em; flex-direction: row; align-items: baseline; gap: 10px; }
  .wordmark-sm span { font-size: 9px; letter-spacing: .3em; }
  .brand-symbol { height: 30px; width: auto; flex-shrink: 0; }

  /* Acento sutil — uma linha de tinta sob o título da página */
  .page-title { position: relative; display: inline-block; }
  .page-title::after { content: ""; position: absolute; left: 0; bottom: -8px; width: 44px; height: 3px; background: var(--ink); border-radius: 2px; }

</style>
</head>

// Nó do logo como ícone de status
function Node({ size = 22, filled = false }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
      <circle cx="6" cy="12" r="2.3" fill={filled ? "#0A0A0A" : "#C9C9C9"} />
      <circle cx="12" cy="7" r="2.3" fill={filled ? "#0A0A0A" : "#C9C9C9"} />
      <circle cx="12" cy="17" r="2.3" fill={filled ? "#0A0A0A" : "#C9C9C9"} />
      <circle cx="18" cy="12" r="2.3" fill={filled ? "#0A0A0A" : "#C9C9C9"} />
      <path d="M8 12 L12 7 M8 12 L12 17 M12 7 L18 12 M12 17 L18 12" stroke={filled ? "#0A0A0A" : "#C9C9C9"} strokeWidth="1.2" />
    </svg>
  );
}

function api(path, opts = {}) {
  const token = localStorage.getItem("astra_token");
  const headers = { ...(opts.headers || {}) };
  if (token) headers["Authorization"] = `Bearer ${token}`;
  if (opts.json) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.json); delete opts.json; }
  return fetch(`${API}${path}`, { ...opts, headers });
}

function Auth({ onLogin }) {
  const [mode, setMode] = useState("login");
  const [form, setForm] = useState({ name: "", email: "", password: "" });
  const [msg, setMsg] = useState(null);
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setMsg(null); setLoading(true);
    try {
      if (mode === "register") {
        const r = await api("/auth/register", { method: "POST", json: form });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || "Erro ao criar conta");
        setMode("login"); setMsg({ type: "ok", text: "Conta criada. Entre com seu e-mail e senha." });
      } else {
        const r = await api("/auth/login", { method: "POST", json: { email: form.email, password: form.password } });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || "Não foi possível entrar");
        localStorage.setItem("astra_token", d.token);
        localStorage.setItem("astra_user", JSON.stringify(d.user));
        onLogin(d.user);
      }
    } catch (e) { setMsg({ type: "err", text: e.message }); }
    finally { setLoading(false); }
  };

  return (
    <div className="auth-shell">
      <div className="auth-card">
        <div className="auth-logo">
          <img src={SYMBOL} alt="" className="auth-symbol" />
          <div className="wordmark">ASTRA<span>CONNECT</span></div>
        </div>
        <div className="auth-title">{mode === "login" ? "Entrar" : "Criar conta"}</div>
        <div className="auth-sub">Processamento de vídeos em escala</div>
        {msg && <div className={`msg msg-${msg.type}`}>{msg.text}</div>}
        {mode === "register" && (
          <div>
            <label>Nome</label>
            <input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Seu nome" />
          </div>
        )}
        <label>E-mail</label>
        <input type="email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} placeholder="voce@email.com" />
        <label>Senha</label>
        <input type="password" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })}
          placeholder="Mínimo 6 caracteres" onKeyDown={e => e.key === "Enter" && submit()} />
        <button className="btn" onClick={submit} disabled={loading}>
          {loading ? <span className="spin"></span> : (mode === "login" ? "Entrar" : "Criar conta")}
        </button>
        <div className="switch">
          {mode === "login" ? "Ainda não tem conta? " : "Já tem conta? "}
          <button onClick={() => { setMode(mode === "login" ? "register" : "login"); setMsg(null); }}>
            {mode === "login" ? "Criar conta" : "Entrar"}
          </button>
        </div>
      </div>
    </div>
  );
}

const STATUS_LABEL = { NA_FILA: "Na fila", PROCESSANDO: "Processando", CONCLUIDO: "Concluído", ERRO: "Erro", RECEBIDO: "Recebido" };

function Dashboard({ user, onLogout }) {
  const [videos, setVideos] = useState([]);
  const [file, setFile] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [msg, setMsg] = useState(null);
  const [drag, setDrag] = useState(false);
  const inputRef = useRef();

  const load = useCallback(async () => {
    try {
      const r = await api("/videos");
      if (r.status === 401) return onLogout();
      const d = await r.json();
      if (r.ok) setVideos(d.data || []);
    } catch {}
  }, [onLogout]);

  useEffect(() => {
    load();
    // Atualiza o status automaticamente enquanto houver vídeo processando
    const t = setInterval(load, 4000);
    return () => clearInterval(t);
  }, [load]);

  const doUpload = async () => {
    if (!file) return;
    setUploading(true); setMsg(null);
    try {
      const fd = new FormData();
      fd.append("video", file);
      const r = await api("/videos", { method: "POST", body: fd });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Falha no envio");
      setFile(null); setMsg({ type: "ok", text: "Vídeo enviado. O processamento começa em instantes." });
      load();
    } catch (e) { setMsg({ type: "err", text: e.message }); }
    finally { setUploading(false); }
  };

  const download = async (id, name) => {
    const r = await api(`/videos/${id}/download`);
    if (!r.ok) { const d = await r.json().catch(() => ({})); setMsg({ type: "err", text: d.error || "Download indisponível" }); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `${name}.zip`; a.click();
    URL.revokeObjectURL(url);
  };

  const onDrop = (e) => { e.preventDefault(); setDrag(false); const f = e.dataTransfer.files[0]; if (f) setFile(f); };

  return (
    <div>
      <header><div className="wrap topbar">
        <div className="brand">
          <div className="wordmark wordmark-sm">ASTRA<span>CONNECT</span></div>
        </div>
        <button className="logout" onClick={onLogout}>Sair — {user.name}</button>
      </div></header>

      <main className="wrap">
        <div className="page-title">Seus vídeos</div>
        <div className="page-sub">Envie um vídeo e baixe os frames extraídos em um arquivo .zip.</div>

        {msg && <div className={`msg msg-${msg.type}`} style={{ marginBottom: 24 }}>{msg.text}</div>}

        <div className={`upload-zone ${drag ? "drag" : ""}`}
          onClick={() => inputRef.current.click()}
          onDragOver={e => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)} onDrop={onDrop}>
          <div className="node-ico"><Node size={40} filled={!!file} /></div>
          <h3>{file ? "Pronto para enviar" : "Arraste um vídeo ou clique para escolher"}</h3>
          <p>{file ? "" : "MP4, MOV, AVI — até 500 MB"}</p>
          {file && <div className="fname">{file.name}</div>}
          <input ref={inputRef} type="file" accept="video/*" style={{ display: "none" }}
            onChange={e => { setFile(e.target.files[0]); setMsg(null); }} />
        </div>
        {file && (
          <button className="btn" style={{ marginTop: -28, marginBottom: 44 }} onClick={doUpload} disabled={uploading}>
            {uploading ? <span className="spin"></span> : "Enviar para processamento"}
          </button>
        )}

        <div className="section-head">
          <h2>Histórico</h2>
          <span className="refresh">Atualiza automaticamente</span>
        </div>

        {videos.length === 0 ? (
          <div className="empty">
            <Node size={48} />
            <p>Nenhum vídeo enviado ainda.</p>
          </div>
        ) : (
          <div className="list">
            {videos.map(v => (
              <div className="row" key={v.id}>
                <div className="row-node"><Node filled={v.status === "CONCLUIDO"} /></div>
                <div className="row-main">
                  <div className="row-name">{v.originalName}</div>
                  <div className="row-meta">
                    {v.status === "CONCLUIDO" && v.frameCount ? `${v.frameCount} frames · ` : ""}
                    {new Date(v.createdAt).toLocaleString("pt-BR")}
                    {v.status === "ERRO" && v.errorMessage ? ` · ${v.errorMessage}` : ""}
                  </div>
                </div>
                <span className="status" data-s={v.status}>
                  {(v.status === "PROCESSANDO" || v.status === "NA_FILA") && <span className="spin" style={{ marginRight: 6 }}></span>}
                  {STATUS_LABEL[v.status] || v.status}
                </span>
                {v.status === "CONCLUIDO" && <button className="dl" onClick={() => download(v.id, v.originalName)}>Baixar .zip</button>}
              </div>
            ))}
          </div>
        )}
      </main>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(() => {
    const u = localStorage.getItem("astra_user");
    return u ? JSON.parse(u) : null;
  });
  const logout = () => { localStorage.removeItem("astra_token"); localStorage.removeItem("astra_user"); setUser(null); };
  return user ? <Dashboard user={user} onLogout={logout} /> : <Auth onLogin={setUser} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
