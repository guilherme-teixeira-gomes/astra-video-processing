name: CI - ASTRA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-service:
    name: API Service - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build (TypeScript)
        run: npm run build
      - name: Testes + cobertura
        run: npm run test:coverage
      - name: Upload cobertura API
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: services/api-service/coverage/lcov.info

  processor-service:
    name: Processor Service - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/processor-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build (TypeScript)
        run: npm run build
      - name: Testes + cobertura
        run: npm run test:coverage
      - name: Upload cobertura Processor
        uses: actions/upload-artifact@v4
        with:
          name: coverage-processor
          path: services/processor-service/coverage/lcov.info

  sonarcloud:
    name: Análise de Qualidade (SonarCloud)
    runs-on: ubuntu-latest
    needs: [api-service, processor-service]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Gera a cobertura localmente para o Sonar ler
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cobertura API
        run: cd services/api-service && npm ci && npm run test:coverage
      - name: Cobertura Processor
        run: cd services/processor-service && npm ci && npm run test:coverage
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    name: Validar build das imagens Docker
    runs-on: ubuntu-latest
    needs: [api-service, processor-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build imagem API Service
        run: docker build -t astra-api-service ./services/api-service
      - name: Build imagem Processor Service
        run: docker build -t astra-processor-service ./services/processor-service
      - name: Build imagem Frontend
        run: docker build -t astra-frontend ./frontend
